name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Public package checks
    runs-on: ubuntu-26.04
    outputs:
      release_requested: ${{ steps.release.outputs.release_requested }}
      version: ${{ steps.release.outputs.version }}
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Pin npm CLI
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund

      - name: Identify versioned main release
        id: release
        run: node tools/release.cjs plan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: 1.5.1

      - name: Check formatting
        run: yarn format:check

      - name: Lint contracts
        run: yarn lint

      - name: Test release controls
        run: yarn test:release

      - name: Build package exports
        run: yarn build

      - name: Check TypeScript and contract sizes
        run: yarn typecheck && yarn check:sizes

      - name: Run local contract tests
        run: yarn tests:foundry

      - name: Test package artifact verification
        run: yarn test:package-verifier

      - name: Verify package artifacts and sources
        run: yarn verify:package

      - name: Test installed release tarball
        run: yarn test:package
        env:
          TOKENOMICS_RELEASE_OUTPUT: ${{ runner.temp }}/tokenomics-release

      - name: Preserve verified release candidate
        id: candidate
        if: steps.release.outputs.release_requested == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tokenomics-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tokenomics-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish verified package
    needs: check
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Neverland-Money/neverland-tokenomics' &&
      needs.check.outputs.release_requested == 'true'
    runs-on: ubuntu-26.04
    concurrency:
      group: tokenomics-npm-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Pin npm CLI
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund

      - name: Download verified release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.artifact_id }}
          path: ${{ runner.temp }}/tokenomics-release
          merge-multiple: true

      - name: Publish or verify npm package, then create GitHub release
        run: node tools/release.cjs publish "$TOKENOMICS_RELEASE_OUTPUT"
        env:
          TOKENOMICS_RELEASE_OUTPUT: ${{ runner.temp }}/tokenomics-release
          TOKENOMICS_RELEASE_ARTIFACT_ID: ${{ needs.check.outputs.artifact_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer-runs = 200
evm_version = "cancun"
bytecode_hash = "none"
extra_output_files = ["abi", "metadata"]
ignored_error_codes = ["license","code-size","init-code-size","transient-storage",8760,2519,3628]
fs_permissions = [
  { access = "read", path = "./ADDRESS_BOOK.md" },
  { access = "read", path = "./src" },
  { access = "read", path = "./out" },
]

[lint]
ignore = [
  "src/leaderboard/ProxyImports.sol",
]
exclude_lints = [
  "mixed-case-function",
  "mixed-case-variable",
  "unwrapped-modifier-logic",
  "named-struct-fields",
  "divide-before-multiply",
  "unaliased-plain-import",
  "screaming-snake-case-immutable",
  "screaming-snake-case-const",
  "unsafe-typecast",
  "erc20-unchecked-transfer",
  "unsafe-cheatcode",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
